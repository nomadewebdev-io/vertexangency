      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#00DF81" />
    </linearGradient>
    <linearGradient id="vertexBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
